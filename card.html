<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>30日間チャレンジ達成カード</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div id="loading" class="loading">読み込み中...</div>

    <div id="content" hidden>
      <div class="quote-banner">
        <p class="label">今日の一言</p>
        <p class="quote" id="quote-text"></p>
      </div>

      <div class="challenge-header">
        <p class="name" id="student-name"></p>
        <p class="challenge" id="challenge-text"></p>
      </div>

      <div id="reward" class="reward-card" hidden>
        <p class="emoji">🎉🏆🎉</p>
        <h2>30日間、やり通したね!</h2>
        <p>
          決めたことを最後まで続けたあなたは、もう自分を信じていい。<br />
          これは、これからの自分への大きな自信になるよ。
        </p>
      </div>

      <div id="progress" class="progress-wrap">
        <p class="progress-count" id="progress-count"></p>
        <div class="progress-bar">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="grid" id="day-grid"></div>

      <p class="footnote" id="footnote"></p>

      <div class="switch-link">
        <button type="button" id="switch-btn">ちがう名前で使う</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="app.js"></script>
  <script>
    const loadingEl = document.getElementById("loading")
    const contentEl = document.getElementById("content")
    const quoteText = document.getElementById("quote-text")
    const studentNameEl = document.getElementById("student-name")
    const challengeTextEl = document.getElementById("challenge-text")
    const rewardEl = document.getElementById("reward")
    const progressEl = document.getElementById("progress")
    const progressCountEl = document.getElementById("progress-count")
    const progressFillEl = document.getElementById("progress-fill")
    const gridEl = document.getElementById("day-grid")
    const footnoteEl = document.getElementById("footnote")
    const switchBtn = document.getElementById("switch-btn")

    let student = null
    let stampDates = new Set()
    let todayOffset = 0

    async function init() {
      const studentId = getStudentIdFromLocalStorage()
      if (!studentId) {
        window.location.href = "index.html"
        return
      }

      try {
        student = await getStudentById(studentId)
      } catch {
        student = null
      }
      if (!student) {
        clearStudentIdFromLocalStorage()
        window.location.href = "index.html"
        return
      }

      stampDates = await getStampDates(student.id)
      todayOffset = dayOffsetFromStart(student.start_date)

      quoteText.textContent = quoteForDay(dayOfYear(todayStr()))
      studentNameEl.textContent = `${withSan(student.display_name)}のチャレンジ`
      challengeTextEl.textContent = `「${student.challenge}」`

      render()

      loadingEl.hidden = true
      contentEl.hidden = false
    }

    function buildDays() {
      const days = []
      for (let i = 0; i < PROGRAM_LENGTH; i++) {
        const date = addDays(student.start_date, i)
        days.push({
          index: i + 1,
          date,
          filled: stampDates.has(date),
          isToday: i === todayOffset,
          isFuture: i > todayOffset,
        })
      }
      return days
    }

    function render() {
      const days = buildDays()
      const achievedCount = days.filter((d) => d.filled).length
      const isComplete = achievedCount >= PROGRAM_LENGTH

      rewardEl.hidden = !isComplete
      progressEl.hidden = isComplete
      if (!isComplete) {
        progressCountEl.textContent = `${achievedCount} / ${PROGRAM_LENGTH} 日 達成中`
        progressFillEl.style.width = `${(achievedCount / PROGRAM_LENGTH) * 100}%`
      }

      if (todayOffset >= 0 && todayOffset < PROGRAM_LENGTH) {
        footnoteEl.textContent = "今日のマスをタップしてスタンプを押そう(もう一度タップで取り消せます)"
      } else if (todayOffset < 0) {
        footnoteEl.textContent = "チャレンジ開始日になったら、スタンプを押せるようになります"
      } else {
        footnoteEl.textContent = "30日間が終了しました。おつかれさまでした!"
      }

      gridEl.innerHTML = ""
      for (const day of days) {
        const btn = document.createElement("button")
        btn.type = "button"
        btn.className = "day-cell"
        if (day.filled) btn.classList.add("is-filled")
        if (day.isToday) btn.classList.add("is-today")
        if (day.isFuture) btn.classList.add("is-future")
        btn.textContent = day.filled ? "★" : String(day.index)
        btn.setAttribute("aria-label", `${day.index}日目${day.filled ? "・達成済み" : ""}`)
        if (day.isToday) {
          btn.addEventListener("click", () => handleToggle(day, btn))
        } else {
          btn.disabled = true
        }
        gridEl.appendChild(btn)
      }
    }

    async function handleToggle(day, btn) {
      btn.disabled = true
      const willFill = !day.filled
      try {
        const filled = await toggleTodayStamp(student.id)
        if (filled) {
          stampDates.add(day.date)
          if (willFill) fireConfetti()
        } else {
          stampDates.delete(day.date)
        }
        render()
      } catch {
        // 失敗しても静かに再描画(ネットワーク不調時など)
        render()
      }
    }

    switchBtn.addEventListener("click", () => {
      clearStudentIdFromLocalStorage()
      window.location.href = "index.html"
    })

    init()
  </script>
</body>
</html>
