<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理者一覧 | 30日間チャレンジ達成カード</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    main.admin { max-width: 720px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--gridline); }
    th { color: var(--text-secondary); font-weight: 700; white-space: nowrap; }
    td.count { font-weight: 900; color: var(--accent); white-space: nowrap; }
    td.name { white-space: nowrap; }
    .table-wrap { overflow-x: auto; border-radius: 16px; background: var(--surface-1); box-shadow: var(--glow-shadow); padding: 4px 12px; }
    .refresh-btn { margin: 16px 0; }
    .summary { margin-bottom: 16px; font-size: 14px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <main class="admin">
    <div class="lead" style="margin-bottom: 24px;">
      <p class="eyebrow">管理者一覧</p>
      <h1 style="font-size: 20px;">30日間チャレンジ達成カード</h1>
    </div>

    <div id="loading" class="loading">読み込み中...</div>
    <div id="content" hidden>
      <p class="summary" id="summary-text"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>お名前</th>
              <th>チャレンジ内容</th>
              <th>開始日</th>
              <th>達成日数</th>
              <th>最終更新</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <button type="button" class="btn-primary refresh-btn" id="refresh-btn">再読み込み</button>
    </div>
    <p class="error" id="error-msg" hidden></p>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const loadingEl = document.getElementById("loading")
    const contentEl = document.getElementById("content")
    const errorEl = document.getElementById("error-msg")
    const summaryEl = document.getElementById("summary-text")
    const tbody = document.getElementById("table-body")
    const refreshBtn = document.getElementById("refresh-btn")

    function formatUpdatedAt(iso) {
      if (!iso) return "-"
      try {
        const d = new Date(iso)
        return d.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
      } catch {
        return iso
      }
    }

    async function load() {
      loadingEl.hidden = false
      contentEl.hidden = true
      errorEl.hidden = true
      try {
        const students = await listAllStudents()
        students.sort((a, b) => (b.achieved_count || 0) - (a.achieved_count || 0))

        summaryEl.textContent = `受講生 ${students.length}人`

        tbody.innerHTML = ""
        for (const s of students) {
          const tr = document.createElement("tr")

          const nameTd = document.createElement("td")
          nameTd.className = "name"
          nameTd.textContent = s.display_name
          tr.appendChild(nameTd)

          const challengeTd = document.createElement("td")
          challengeTd.textContent = s.challenge
          tr.appendChild(challengeTd)

          const startTd = document.createElement("td")
          startTd.textContent = s.start_date
          tr.appendChild(startTd)

          const countTd = document.createElement("td")
          countTd.className = "count"
          countTd.textContent = `${s.achieved_count || 0} / ${PROGRAM_LENGTH}`
          tr.appendChild(countTd)

          const updatedTd = document.createElement("td")
          updatedTd.textContent = formatUpdatedAt(s.updated_at)
          tr.appendChild(updatedTd)

          tbody.appendChild(tr)
        }

        loadingEl.hidden = true
        contentEl.hidden = false
      } catch (err) {
        loadingEl.hidden = true
        errorEl.textContent = err && err.message ? err.message : "読み込みに失敗しました。"
        errorEl.hidden = false
      }
    }

    refreshBtn.addEventListener("click", load)
    load()
  </script>
</body>
</html>
